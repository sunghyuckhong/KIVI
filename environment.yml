name: kivi
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
    # ── PyTorch (CUDA 11.8) ───────────────────────────────────────────────────
    # Install via: pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cu118
    - torch==2.1.2+cu118
    - torchvision==0.16.2

    # ── Core ML libraries ─────────────────────────────────────────────────────
    - transformers==4.36.2
    - tokenizers==0.15.0
    - accelerate==0.25.0
    - safetensors==0.4.1
    - huggingface-hub==0.20.2
    - datasets==2.16.1
    - sentencepiece==0.1.99
    - peft==0.7.1
    - protobuf==4.25.1

    # ── FlashAttention (optional, requires Ampere+ GPU / sm_80+) ─────────────
    # V100 (sm_70) users: skip this, set config.use_flash = False in run scripts
    # Install via: pip install flash-attn==2.5.6 --no-build-isolation
    - flash-attn==2.5.6

    # ── Evaluation ────────────────────────────────────────────────────────────
    # lm-eval: install from specific commit used in the paper
    #   pip install -e "git+https://github.com/EleutherAI/lm-evaluation-harness.git@c9bbec6e7de418b9082379da82797522eb173054#egg=lm_eval"
    - evaluate==0.4.1
    - rouge-score==0.1.2
    - sacrebleu==1.5.0
    - nltk==3.8.1

    # ── Numerics / data ───────────────────────────────────────────────────────
    - numpy==1.26.3
    - scipy==1.11.4
    - scikit-learn==1.3.2
    - pandas==2.1.4
    - pyarrow==14.0.2

    # ── Utilities ─────────────────────────────────────────────────────────────
    - tqdm==4.66.1
    - packaging==24.0
    - einops==0.7.0
    - pyyaml==6.0.1
    - jsonlines==4.0.0
    - tabulate==0.9.0
    - sqlitedict==2.1.0
    - numexpr==2.8.8
    - pybind11==2.11.1

# ── Post-install steps (run manually after conda env create) ──────────────────
#
# 1. Install PyTorch with correct CUDA URL:
#    pip install torch==2.1.2 torchvision==0.16.2 \
#        --index-url https://download.pytorch.org/whl/cu118
#
# 2. Install KIVI package (editable, no deps to avoid torch pin conflict):
#    pip install -e . --no-deps
#
# 3. Install KIVI quant CUDA kernels (requires torch to be present first):
#    cd quant && pip install -e . --no-build-isolation
#
# 4. Install lm-eval from paper's commit:
#    pip install -e "git+https://github.com/EleutherAI/lm-evaluation-harness.git@c9bbec6e7de418b9082379da82797522eb173054#egg=lm_eval"
#
# 5. Install flash-attn (Ampere+ GPUs only, skip for V100):
#    pip install flash-attn==2.5.6 --no-build-isolation
#
# 6. Authenticate with HuggingFace (needed for gated models):
#    huggingface-cli login
#
# NOTE: The current KIVI model code (models/*.py) requires transformers>=4.43
#       for the updated LlamaRotaryEmbedding API. If using transformers==4.36.2
#       (paper version), you need the original model files from the KIVI repo's
#       lmeval branch: https://github.com/jy-yuan/KIVI/tree/lmeval
